<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="enterprise-agent-system: run AI agents in a company on AWS Bedrock AgentCore, managed entirely with Terraform" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0f1d3a"/>
    </linearGradient>
    <radialGradient id="glowAmber" cx="0.08" cy="0.08" r="0.55">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.92" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="360" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <rect width="1280" height="360" fill="url(#glowAmber)"/>
    <rect width="1280" height="360" fill="url(#glowTeal)"/>
  </g>

  <!-- left: text -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="112" font-size="64" font-weight="800" fill="url(#title)" letter-spacing="-2">Enterprise Agent</text>
    <text x="64" y="180" font-size="64" font-weight="800" fill="url(#title)" letter-spacing="-2">System</text>

    <text x="66" y="226" font-size="22" fill="#e2e8f0">Build and run AI agents for your company</text>
    <text x="66" y="256" font-size="22" fill="#e2e8f0">on AWS AgentCore</text>

    <g font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">
      <rect x="64"  y="296" width="100" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="114" y="316">AgentCore</text>
      <rect x="174" y="296" width="100" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="224" y="316">Terraform</text>
      <rect x="284" y="296" width="100" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="334" y="316">LangGraph</text>
      <rect x="394" y="296" width="64"  height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="426" y="316">MCP</text>
      <rect x="468" y="296" width="70"  height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="503" y="316">Cedar</text>
      <rect x="548" y="296" width="108" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="602" y="316">CloudWatch</text>
    </g>
  </g>

  <!-- right: terminal card -->
  <g>
    <rect x="720" y="52" width="500" height="256" rx="14" fill="#04070d" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="746" cy="76" r="6" fill="#ef4444"/>
    <circle cx="766" cy="76" r="6" fill="#f59e0b"/>
    <circle cx="786" cy="76" r="6" fill="#22c55e"/>
    <text x="970" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748b" text-anchor="middle">it_helpdesk / session</text>
    <line x1="720" y1="98" x2="1220" y2="98" stroke="#ffffff" stroke-opacity="0.08"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <text x="744" y="130" fill="#e2e8f0"><tspan fill="#5eead4">You:</tspan>  my laptop won't boot, file a ticket</text>
      <text x="744" y="156" fill="#94a3b8">tool    tickets___create_ticket ........ <tspan fill="#4ade80">allowed</tspan></text>
      <text x="744" y="190" fill="#e2e8f0"><tspan fill="#5eead4">You:</tspan>  now close it</text>
      <text x="744" y="216" fill="#94a3b8">policy  tickets___close_ticket ....... <tspan fill="#f87171">denied</tspan></text>
      <text x="744" y="238" fill="#64748b">        (platform-admins only)</text>
      <text x="744" y="268" fill="#fbbf24">trace   sent to CloudWatch, eval sampled</text>
      <rect x="744" y="280" width="9" height="16" fill="#5eead4">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.99;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>